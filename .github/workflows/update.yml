name: Update dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/fetch_currency.py
      - run: python scripts/fetch_fuel.py
      - run: python scripts/fetch_utilities.py
      - run: python scripts/build_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Обновление данных: $(date -u +%F)"
          git push
